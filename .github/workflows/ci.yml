# Source -> Build -> Test -> Package -> Deploy (compose) -> Health check -> Calibrate + load test -> evidence artifacts
name: ci
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: backend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements*.txt}
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Policy benchmark on the twin (short)
        run: python -m scripts.bench 150 | tee ../bench.txt
      - uses: actions/upload-artifact@v4
        with: {name: bench, path: bench.txt}

  config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prometheus rules + config
        run: |
          docker run --rm -v "$PWD/ops:/ops" --entrypoint promtool prom/prometheus:v3.5.0 check rules /ops/alerts.yml
          sed 's#/etc/prometheus/alerts.yml#/ops/alerts.yml#' ops/prometheus.yml > /tmp/prom.yml
          docker run --rm -v "$PWD/ops:/ops" -v /tmp/prom.yml:/tmp/prom.yml --entrypoint promtool prom/prometheus:v3.5.0 check config /tmp/prom.yml
      - name: Compose file
        run: cp .env.example .env && docker compose config -q
      - name: Dashboard JSON
        run: python -c "import json; d=json.load(open('ops/grafana/dashboards/fuelops.json')); print(len(d['panels']), 'panels')"

  deploy-smoke:
    needs: [test, config]
    runs-on: ubuntu-latest
    env: {ADMIN_TOKEN: ci-token}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements*.txt}
      - run: pip install -r backend/requirements.txt
      - name: Start the real simulator image alone
        run: |
          cp .env.example .env && sed -i "s/^ADMIN_TOKEN=.*/ADMIN_TOKEN=$ADMIN_TOKEN/" .env
          docker compose up -d --no-deps simulator
          for i in $(seq 1 60); do curl -fs localhost:8000/v1/health && break; sleep 2; done
      - name: Calibrate digital twin against the real simulator (before the backend exists, so nothing else writes)
        working-directory: backend
        run: python -m scripts.calibrate --base http://localhost:8000 --ticks 120 --out ../calibration.json
      - name: Build + deploy (backend, prometheus; ml-service skipped -> rule router)
        run: |
          docker compose build backend
          docker compose up -d --no-deps backend prometheus
      - name: Health check
        run: |
          for i in $(seq 1 60); do
            s=$(curl -fs localhost:8080/api/health | python -c "import json,sys; print(json.load(sys.stdin)['components']['simulator']['status'])" 2>/dev/null) && [ "$s" = healthy ] && break
            sleep 2
          done
          curl -fs localhost:8080/api/health | python -m json.tool
          test "$s" = healthy
      - name: Run the simulator + inject a crisis, let the backend decide
        run: |
          H="-H X-Admin-Token:$ADMIN_TOKEN -H Content-Type:application/json"
          curl -fs $H -X POST localhost:8080/api/sim/run
          curl -fs $H -X POST localhost:8080/api/chaos/event -d '{"type":"demand_spike","duration_ticks":60,"parameters":{"multiplier":1.8}}'
          sleep 40
          curl -fs "localhost:8080/api/decisions?limit=200" > decisions.json
          python -c "import json; d=json.load(open('decisions.json')); print(len(d), 'decisions'); assert d"
      - name: Load test (incl. simulator latency fault)
        working-directory: backend
        run: python -m scripts.loadtest --token "$ADMIN_TOKEN" --seconds 15 --out ../loadtest
      - name: Metrics snapshot
        if: always()
        run: |
          curl -s localhost:8080/metrics > metrics.txt || true
          curl -s localhost:9090/api/v1/rules > prometheus-rules.json || true
          docker compose logs --no-color > compose.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence
          path: |
            calibration.json
            decisions.json
            loadtest.json
            loadtest.md
            metrics.txt
            prometheus-rules.json
            compose.log
      - if: always()
        run: docker compose down -v

  ml-image:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t fuelops-ml ml/
