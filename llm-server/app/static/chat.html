<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Local LLM Chat</title>
<style>
  :root {
    --bg: #f5f6f8; --panel: #ffffff; --text: #1b1f24; --muted: #667085; --border: #dde1e7;
    --accent: #2563eb; --accent-text: #fff; --user: #2563eb; --user-text: #fff; --bot: #ffffff; --bad: #b91c1c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1116; --panel: #161a21; --text: #e6e9ee; --muted: #8b95a5; --border: #29303a;
      --accent: #3b82f6; --user: #2f5fd0; --bot: #1b2029; --bad: #f87171;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--border); }
  header h1 { font-size: 16px; margin: 0; margin-right: auto; }
  header select, header button, header input { font: inherit; font-size: 13px; padding: 6px 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--text); }
  header button { cursor: pointer; }
  #status { font-size: 12px; color: var(--muted); }
  #sysWrap { display: none; padding: 8px 16px; background: var(--panel); border-bottom: 1px solid var(--border); }
  #sysWrap.open { display: block; }
  #sysWrap textarea { width: 100%; font: inherit; font-size: 13px; padding: 8px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--text); resize: vertical; }
  #log { flex: 1; overflow-y: auto; padding: 20px 16px; }
  .inner { max-width: 820px; margin: 0 auto; }
  .msg { display: flex; margin: 10px 0; }
  .msg.user { justify-content: flex-end; }
  .bubble { max-width: 80%; padding: 10px 14px; border-radius: 14px; white-space: pre-wrap; word-wrap: break-word; }
  .user .bubble { background: var(--user); color: var(--user-text); border-bottom-right-radius: 4px; }
  .assistant .bubble { background: var(--bot); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .meta { font-size: 11px; color: var(--muted); margin-top: 4px; }
  .error .bubble { border-color: var(--bad); color: var(--bad); }
  .cursor::after { content: "▍"; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .empty { text-align: center; color: var(--muted); margin-top: 18vh; }
  .empty b { display: block; font-size: 20px; color: var(--text); margin-bottom: 6px; }
  .chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 14px; }
  .chips button { font: inherit; font-size: 13px; padding: 7px 12px; border-radius: 999px; border: 1px solid var(--border); background: var(--panel); color: var(--text); cursor: pointer; }
  footer { padding: 12px 16px 16px; background: var(--bg); }
  .composer { max-width: 820px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 8px; }
  .composer textarea { flex: 1; border: 0; outline: none; resize: none; background: transparent; color: var(--text); font: inherit; max-height: 180px; padding: 6px; }
  .composer button { font: inherit; font-weight: 600; padding: 8px 16px; border-radius: 8px; border: 0; background: var(--accent); color: var(--accent-text); cursor: pointer; }
  .composer button.stop { background: var(--bad); }
  .hint { max-width: 820px; margin: 6px auto 0; font-size: 11px; color: var(--muted); text-align: center; }
</style>
</head>
<body>
<header>
  <h1>💬 Local LLM Chat</h1>
  <span id="status">connecting…</span>
  <select id="model" aria-label="Model"></select>
  <input id="apiKey" type="password" placeholder="API key (if set)" size="14" aria-label="API key">
  <button id="sysBtn" title="Edit system prompt">System prompt</button>
  <button id="clearBtn" title="Start a new conversation">New chat</button>
</header>
<div id="sysWrap">
  <textarea id="system" rows="2">You are a helpful, concise assistant for a fuel supply operations team.</textarea>
</div>

<div id="log"><div class="inner" id="inner"></div></div>

<footer>
  <div class="composer">
    <textarea id="input" rows="1" placeholder="Message the model…" aria-label="Message"></textarea>
    <button id="sendBtn">Send</button>
  </div>
  <div class="hint">Enter to send · Shift+Enter for a new line · runs fully on your machine</div>
</footer>

<script>
const $ = (id) => document.getElementById(id);
const store = {
  get(k, d = "") { try { return localStorage.getItem(k) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};
const BASE = location.protocol.startsWith("http") ? location.origin : "http://127.0.0.1:8100";

let history = [];         // [{role, content}]
let controller = null;    // AbortController while streaming

$("apiKey").value = store.get("llm.apiKey");
$("system").value = store.get("chat.system", $("system").value);

function headers() {
  const h = { "Content-Type": "application/json" };
  const k = $("apiKey").value.trim();
  if (k) h["Authorization"] = "Bearer " + k;
  return h;
}

async function loadModels() {
  try {
    const r = await fetch(BASE + "/api/models", { headers: headers() });
    if (r.status === 401) { $("status").textContent = "API key required"; return; }
    const d = await r.json();
    const sel = $("model");
    const prev = sel.value || store.get("chat.model", "gemma3-1b");
    sel.innerHTML = d.models.map(m =>
      `<option value="${m.id}">${m.id}${m.ready ? "" : " (" + m.state + ")"}</option>`).join("");
    sel.value = [...sel.options].some(o => o.value === prev) ? prev : d.default_model;
    const ready = d.models.filter(m => m.ready).length;
    $("status").textContent = `${ready}/${d.models.length} models ready`;
  } catch {
    $("status").textContent = "server unreachable";
  }
}

function render() {
  const inner = $("inner");
  if (!history.length) {
    inner.innerHTML = `<div class="empty"><b>Chat with a local model</b>Pick a model at the top and say hello.
      <div class="chips">
        <button>Explain demand forecasting for fuel stations in 3 bullet points.</button>
        <button>A depot has 12,000 L of diesel and 3 stations need 5,000 L each. What should we do?</button>
        <button>Write a one-line incident summary: truck T-7 delayed 2 hours on route R4.</button>
      </div></div>`;
    inner.querySelectorAll(".chips button").forEach(b => b.onclick = () => { $("input").value = b.textContent; send(); });
    return;
  }
  inner.innerHTML = "";
  for (const m of history) inner.appendChild(bubble(m));
  scroll();
}

function bubble(m) {
  const wrap = document.createElement("div");
  wrap.className = "msg " + m.role + (m.error ? " error" : "");
  const col = document.createElement("div");
  const b = document.createElement("div");
  b.className = "bubble" + (m.streaming ? " cursor" : "");
  b.textContent = m.content;
  col.appendChild(b);
  if (m.meta) {
    const meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent = m.meta;
    col.appendChild(meta);
  }
  wrap.appendChild(col);
  m.el = b;
  m.wrap = wrap;
  return wrap;
}

function scroll() { $("log").scrollTop = $("log").scrollHeight; }

function setBusy(busy) {
  const btn = $("sendBtn");
  btn.textContent = busy ? "Stop" : "Send";
  btn.classList.toggle("stop", busy);
}

async function send() {
  if (controller) { controller.abort(); return; }         // Stop button
  const text = $("input").value.trim();
  if (!text) return;
  $("input").value = "";
  autosize();

  history.push({ role: "user", content: text });
  const reply = { role: "assistant", content: "", streaming: true };
  history.push(reply);
  render();

  const messages = [];
  const sys = $("system").value.trim();
  if (sys) messages.push({ role: "system", content: sys });
  for (const m of history) if (m !== reply && !m.error) messages.push({ role: m.role, content: m.content });

  controller = new AbortController();
  setBusy(true);
  const t0 = performance.now();
  let firstToken = null, timings = null, served = $("model").value;

  try {
    const res = await fetch(BASE + "/v1/chat/completions", {
      method: "POST",
      headers: headers(),
      signal: controller.signal,
      body: JSON.stringify({
        model: $("model").value, messages, stream: true, max_tokens: 512, temperature: 0.7,
      }),
    });
    if (!res.ok) {
      const body = await res.text();
      let msg = body;
      try { msg = JSON.parse(body).detail || body; } catch {}
      throw new Error(`HTTP ${res.status}: ${typeof msg === "string" ? msg : JSON.stringify(msg)}`);
    }
    served = res.headers.get("X-Served-Model") || served;

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = "";
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      let nl;
      while ((nl = buf.indexOf("\n")) >= 0) {
        const line = buf.slice(0, nl).trim();
        buf = buf.slice(nl + 1);
        if (!line.startsWith("data:")) continue;
        const data = line.slice(5).trim();
        if (data === "[DONE]") continue;
        let chunk;
        try { chunk = JSON.parse(data); } catch { continue; }
        if (chunk.timings) timings = chunk.timings;
        const delta = chunk.choices && chunk.choices[0] && chunk.choices[0].delta;
        if (delta && delta.content) {
          if (firstToken === null) firstToken = performance.now() - t0;
          reply.content += delta.content;
          reply.el.textContent = reply.content;
          scroll();
        }
      }
    }
    const total = (performance.now() - t0) / 1000;
    const bits = [served];
    if (firstToken !== null) bits.push(`first token ${(firstToken / 1000).toFixed(2)}s`);
    if (timings && timings.predicted_per_second) bits.push(`${timings.predicted_per_second.toFixed(1)} tok/s`);
    bits.push(`${total.toFixed(1)}s total`);
    if (served !== $("model").value) bits.push("(fallback)");
    reply.meta = bits.join(" · ");
  } catch (e) {
    if (e.name === "AbortError") {
      reply.meta = "stopped";
    } else {
      reply.error = true;
      reply.content = (reply.content ? reply.content + "\n\n" : "") + "⚠ " + e.message;
    }
  } finally {
    reply.streaming = false;
    if (!reply.content && !reply.error) reply.content = "(no output)";
    controller = null;
    setBusy(false);
    render();
    $("input").focus();
  }
}

function autosize() {
  const t = $("input");
  t.style.height = "auto";
  t.style.height = Math.min(t.scrollHeight, 180) + "px";
}

$("input").addEventListener("input", autosize);
$("input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});
$("sendBtn").onclick = send;
$("clearBtn").onclick = () => { if (controller) controller.abort(); history = []; render(); $("input").focus(); };
$("sysBtn").onclick = () => $("sysWrap").classList.toggle("open");
$("system").addEventListener("change", () => store.set("chat.system", $("system").value));
$("model").addEventListener("change", () => store.set("chat.model", $("model").value));
$("apiKey").addEventListener("change", () => { store.set("llm.apiKey", $("apiKey").value.trim()); loadModels(); });

render();
loadModels();
setInterval(loadModels, 10000);
$("input").focus();
</script>
</body>
</html>
